spring:
  application.name: alert-service
  data:
    mongodb:
      uri: ${MONGODB_URI:}
      database: ${MONGODB_DATABASE:threatstream}
      auto-index-creation: false
      uuid-representation: standard
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_ALERT_GROUP_ID:alert-service-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.threatstream.alert
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.threatstream.alert.AlertEvent
    listener.ack-mode: record
alert:
  topic: ${KAFKA_TOPIC_ALERTS:security.alerts}
  dlt-topic: ${KAFKA_TOPIC_DLT:security.events.dlt}
  retry-attempts: ${KAFKA_RETRY_ATTEMPTS:3}
app.cors.allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
server.port: ${SERVER_PORT:8083}
management.endpoints.web.exposure.include: health,info
logging.level.com.threatstream: INFO
