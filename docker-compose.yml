name: threatstream

services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafka-data:/tmp/kraft-combined-logs]
    ports: ["127.0.0.1:9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on: { kafka: { condition: service_healthy } }
    volumes: [./infrastructure/kafka/topics.sh:/topics.sh:ro]
    entrypoint: ["/bin/sh", "/topics.sh"]
    restart: "no"
  postgres:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threatstream}
      POSTGRES_USER: ${POSTGRES_USER:-threatstream_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  event-collector-service:
    profiles: [apps]
    build: { context: ./backend, dockerfile: ../infrastructure/docker/backend.Dockerfile, args: { MODULE: event-collector-service } }
    environment: { KAFKA_BOOTSTRAP_SERVERS: kafka:9092, SERVER_PORT: 8081 }
    ports: ["127.0.0.1:8081:8081"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on: { kafka-init: { condition: service_completed_successfully } }
  threat-detection-service:
    profiles: [apps]
    build: { context: ./backend, dockerfile: ../infrastructure/docker/backend.Dockerfile, args: { MODULE: threat-detection-service } }
    environment: { KAFKA_BOOTSTRAP_SERVERS: kafka:9092, SERVER_PORT: 8082 }
    ports: ["127.0.0.1:8082:8082"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on: { kafka-init: { condition: service_completed_successfully } }
  alert-service:
    profiles: [apps]
    build: { context: ./backend, dockerfile: ../infrastructure/docker/backend.Dockerfile, args: { MODULE: alert-service } }
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-threatstream}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ALERT_SERVICE_API_KEY: ${ALERT_SERVICE_API_KEY:-}
      SERVER_PORT: 8083
    ports: ["127.0.0.1:8083:8083"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on: { kafka-init: { condition: service_completed_successfully } }
  demo-login-service:
    profiles: [apps]
    build: { context: ./backend, dockerfile: ../infrastructure/docker/backend.Dockerfile, args: { MODULE: demo-login-service } }
    environment:
      SERVER_PORT: 8084
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_AUTH_EVENTS: security.auth.events
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
      DEMO_RATE_LIMIT_PER_MINUTE: ${DEMO_RATE_LIMIT_PER_MINUTE:-60}
      DEMO_LOGIN_USERNAME: ${DEMO_LOGIN_USERNAME:-demo-user}
      DEMO_LOGIN_PASSWORD: ${DEMO_LOGIN_PASSWORD:?Set DEMO_LOGIN_PASSWORD in .env}
    ports: ["127.0.0.1:8084:8084"]
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on: { kafka-init: { condition: service_completed_successfully } }

volumes: { kafka-data: {}, postgres-data: {} }
